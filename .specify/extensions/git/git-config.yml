# Git Branching Workflow Extension Configuration
# Copied to .specify/extensions/git/git-config.yml on install

# Branch numbering strategy: "sequential" (001, 002, ...) or "timestamp" (YYYYMMDD-HHMMSS)
branch_numbering: sequential

# Commit message used by `git commit` during repository initialization
init_commit_message: "chore(spec): initialize repository"

# Auto-commit before/after core commands.
# Set "default" to enable for all commands, then override per-command.
# Each key can be true/false. Message is customizable per-command.
auto_commit:
  default: false
  before_clarify:
    enabled: false
    message: "chore(spec): checkpoint before clarification"
  before_plan:
    enabled: false
    message: "chore(spec): checkpoint before planning"
  before_tasks:
    enabled: false
    message: "chore(spec): checkpoint before task generation"
  before_implement:
    enabled: false
    message: "chore(spec): checkpoint before implementation"
  before_checklist:
    enabled: false
    message: "chore(spec): checkpoint before checklist"
  before_analyze:
    enabled: false
    message: "chore(spec): checkpoint before analysis"
  before_taskstoissues:
    enabled: false
    message: "chore(spec): checkpoint before issue sync"
  after_constitution:
    enabled: true
    message: "docs(constitution): update project constitution"
  after_specify:
    enabled: true
    message: "docs(spec): add feature specification"
  after_clarify:
    enabled: true
    message: "docs(spec): clarify feature specification"
  after_plan:
    enabled: true
    message: "docs(plan): add implementation plan"
  after_tasks:
    enabled: true
    message: "docs(tasks): add implementation tasks"
  after_implement:
    enabled: true
    message: "feat: implement planned feature"
  after_checklist:
    enabled: false
    message: "docs(checklist): add feature checklist"
  after_analyze:
    enabled: false
    message: "docs(analysis): add consistency analysis"
  after_taskstoissues:
    enabled: false
    message: "chore(issues): sync feature tasks"
