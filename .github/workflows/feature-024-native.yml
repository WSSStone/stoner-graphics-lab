name: Feature 024 Native Probe

on:
  push:
    branches:
      - 024-static-mesh-model
  pull_request:
    paths:
      - ".github/workflows/feature-024-native.yml"
      - "Content/Shaders/Deferred/**"
      - "Source/Asset/**"
      - "Source/Backend/Vulkan/**"
      - "Source/Renderer/**"
      - "Tests/DeferredNativeIntegrationTests.cpp"
      - "Tests/AssetStaticModel*.cpp"
      - "Tests/RendererStaticMesh*.cpp"
      - "Tests/VulkanNativeIntegrationTests.cpp"
      - "Tests/Fixtures/StaticModel/**"
      - "Tests/CoordinateConventionTests.*"
      - "Tests/verify_coordinate_convention.py"
      - "Tests/verify_static_model_*.py"
      - ".github/scripts/run_static_model_validation.py"
      - "specs/024-static-mesh-model/**"
  workflow_dispatch:

jobs:
  lavapipe-native-probe:
    name: Linux Lavapipe native packed-uniform probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build and Vulkan dependencies
        run: |
          python -m pip install scons==4.10.1
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers glslang-tools

      - name: Resolve Lavapipe ICD
        shell: bash
        run: |
          lvp_icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$lvp_icd"
          echo "VK_DRIVER_FILES=$lvp_icd" >> "$GITHUB_ENV"

      - name: Build strict Debug test binary
        run: scons config=debug strict=1

      - name: Verify coordinate migration evidence
        run: |
          python Tests/verify_coordinate_convention.py
          python -m unittest Tests/test_verify_coordinate_convention.py

      - name: Verify static-model corpus and architecture evidence
        run: |
          python Tests/verify_static_model_provenance.py
          python Tests/verify_static_model_fixtures.py
          python Tests/verify_asset_layer.py

      - name: Require native indexed static-mesh and packed-uniform readback
        run: >-
          python .github/scripts/run_static_model_validation.py
          --profile native
          --tests Build/Linux/Debug/Tests/StonerTest
          --output Validation/024/Linux/native-static-model-report.txt
          --timeout-seconds 1200

      - name: Upload native probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-024-native-probe-linux
          path: |
            Validation/024/Linux/native-static-model-report.txt
            Validation/024/Linux/native-static-mesh-readback.txt
          if-no-files-found: error
