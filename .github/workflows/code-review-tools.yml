name: Code Review Tools

on:
  pull_request:
    paths:
      - "CodeReview/Tools/**"
      - ".github/workflows/code-review-tools.yml"

jobs:
  cr-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: CodeReview/Tools/requirements.txt
      - name: Install pinned runtime requirements
        run: python -m pip install -r CodeReview/Tools/requirements.txt
      - name: Run CLI unit tests
        run: python -m unittest discover -s CodeReview/Tools/tests -v
      - name: Validate CR-001 state
        run: python CodeReview/Tools/crctl.py lint --id CR-001
