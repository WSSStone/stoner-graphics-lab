name: Feature 028 Production Content

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  pull_request:
    paths:
      - '.github/scripts/*production*'
      - '.github/workflows/feature-028-production-content.yml'
      - 'Config/AssetCooker/Profiles/Production/**'
      - 'Config/Validation/ProductionContent/**'
      - 'Content/ProductionAcceptance/**'
      - 'Content/Shaders/**'
      - 'Demo/StonerDemo/**'
      - 'Source/**'
      - 'Tests/**'
      - 'ThirdParty/flip/**'
      - 'Tools/AssetCooker/**'
      - 'specs/028-production-content-acceptance/**'
  push:
    branches: ['028-production-content-acceptance', 'master']
    paths:
      - '.github/scripts/*production*'
      - '.github/workflows/feature-028-production-content.yml'
      - 'Config/AssetCooker/Profiles/Production/**'
      - 'Config/Validation/ProductionContent/**'
      - 'Content/ProductionAcceptance/**'
      - 'Content/Shaders/**'
      - 'Demo/StonerDemo/**'
      - 'Source/**'
      - 'Tests/**'
      - 'ThirdParty/flip/**'
      - 'Tools/AssetCooker/**'
      - 'specs/028-production-content-acceptance/**'

permissions:
  contents: read

concurrency:
  group: feature-028-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regular:
    if: github.event_name != 'schedule'
    name: Regular ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows Vulkan
            slug: windows-vulkan
            os: windows-latest
            build: Build/Win64/Release
            target: Config/AssetCooker/Profiles/Production/Windows-Vulkan.json
            native: --defer-native-to-hardware
          - name: Linux Vulkan
            slug: linux-vulkan
            os: ubuntu-latest
            build: Build/Linux/Release
            target: Config/AssetCooker/Profiles/Production/Linux-Vulkan.json
            native: ''
          - name: macOS Metal
            slug: macos-metal
            os: macos-26
            build: Build/Mac/Release
            target: Config/AssetCooker/Profiles/Production/Mac-Metal-Arm64.json
            native: ''
          - name: macOS Intel Metal
            slug: macos-intel-metal
            os: macos-26-intel
            build: Build/Mac/Release
            target: Config/AssetCooker/Profiles/Production/Mac-Metal-X86_64.json
            native: ''
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install SCons
        run: python -m pip install scons==4.10.1
      - name: Install Linux graphics dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers
      - name: Build strict Debug
        run: scons config=debug strict=1
      - name: Build strict Release
        run: scons config=release strict=1
      - name: Validate runner contracts
        run: |
          python .github/scripts/test_run_production_content_validation.py
          python .github/scripts/test_production_content_workflows.py
      - name: Run regular profile
        run: >-
          python .github/scripts/run_production_content_validation.py
          --profile regular --target-profile ${{ matrix.target }}
          --build-root ${{ matrix.build }}
          --output Build/Validation/028/${{ matrix.slug }}
          ${{ matrix.native }}
          --timeout-seconds 600
      - name: Upload regular immutable evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-regular-${{ matrix.slug }}-${{ github.run_attempt }}
          path: Build/Validation/028/${{ matrix.slug }}
          if-no-files-found: error
          include-hidden-files: true

  regular-consumer:
    if: github.event_name != 'schedule'
    name: Revalidate ${{ matrix.slug }} artifact
    needs: regular
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: windows-vulkan
            target: Config/AssetCooker/Profiles/Production/Windows-Vulkan.json
          - slug: linux-vulkan
            target: Config/AssetCooker/Profiles/Production/Linux-Vulkan.json
          - slug: macos-metal
            target: Config/AssetCooker/Profiles/Production/Mac-Metal-Arm64.json
          - slug: macos-intel-metal
            target: Config/AssetCooker/Profiles/Production/Mac-Metal-X86_64.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: production-regular-${{ matrix.slug }}-${{ github.run_attempt }}
          path: Build/Validation/028/downloaded/${{ matrix.slug }}
      - name: Revalidate producer artifact digests
        run: >-
          python .github/scripts/run_production_content_validation.py
          --verify-only Build/Validation/028/downloaded/${{ matrix.slug }}
          --target-profile ${{ matrix.target }}
      - name: Preserve consumer verification
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-consumer-${{ matrix.slug }}-${{ github.run_attempt }}
          path: Build/Validation/028/downloaded/${{ matrix.slug }}/artifact-manifest.json
          if-no-files-found: error

  linux-sanitizers:
    if: github.event_name != 'schedule'
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan-UBSan
            slug: asan-ubsan
            sanitizers: address,undefined
          - name: TSan
            slug: tsan
            sanitizers: thread
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1:history_size=7
      STONER_SKIP_OPTIONAL_DEFERRED_NATIVE: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          python -m pip install scons==4.10.1
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers
      - name: Prepare sanitizer evidence
        run: |
          mkdir -p Validation/028/CI/work/${{ matrix.slug }}
          echo "revision=${GITHUB_SHA}" > Validation/028/CI/work/${{ matrix.slug }}/status.txt
      - name: Build sanitizer configuration
        run: >-
          scons config=debug strict=1
          sanitizers=${{ matrix.sanitizers }}
      - name: Run ASan-UBSan failure and lifetime gates
        if: matrix.slug == 'asan-ubsan'
        run: >-
          Build/Linux/Debug/Tests/StonerTest
          --suite asset-gltf-malformed
          --suite asset-gltf-hardening
          --suite asset-manager-cancellation
          --suite asset-manager-shutdown
          --suite renderer-static-model
          --suite production-content
          | tee Validation/028/CI/work/${{ matrix.slug }}/tests.txt
      - name: Run TSan concurrency and lifetime gates
        if: matrix.slug == 'tsan'
        run: >-
          Build/Linux/Debug/Tests/StonerTest
          --suite asset-manager-cancellation
          --suite asset-manager-shutdown
          --suite asset-manager-concurrency
          --suite renderer-static-model
          --suite production-content
          | tee Validation/028/CI/work/${{ matrix.slug }}/tests.txt
      - name: Upload sanitizer evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-sanitizer-${{ matrix.slug }}-${{ github.run_attempt }}
          path: Validation/028/CI/work/${{ matrix.slug }}
          if-no-files-found: error

  medium:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Medium Metal (${{ matrix.slug }})
    runs-on: macos-26-intel
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: khronos-lantern-glb
            slug: lantern
          - package: khronos-sponza-gltf
            slug: sponza
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: python -m pip install scons==4.10.1
      - name: Restore pinned Sponza corpus
        if: matrix.package == 'khronos-sponza-gltf'
        uses: actions/cache@v4
        with:
          path: Content/ProductionAcceptance/External/Sponza
          key: production-sponza-${{ hashFiles('Content/ProductionAcceptance/Corpus/corpus-v1.json') }}
      - name: Acquire pinned medium corpus
        if: matrix.package == 'khronos-sponza-gltf'
        run: >-
          python .github/scripts/acquire_production_corpus.py
          --package khronos-sponza-gltf
          --content-root Content/ProductionAcceptance
      - name: Build strict Release
        run: scons config=release strict=1
      - name: Validate Metal readback modes
        run: Build/Mac/Release/Tests/StonerTest --suite metal-resource
      - name: Run medium profile
        run: >-
          python .github/scripts/run_production_content_validation.py
          --profile medium
          --target-profile Config/AssetCooker/Profiles/Production/Mac-Metal-X86_64.json
          --build-root Build/Mac/Release
          --output Build/Validation/028/medium-metal-${{ matrix.slug }}
          --acquire-missing
          --timeout-seconds 3000
          --package-id ${{ matrix.package }}
      - name: Upload medium evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-medium-macos-metal-${{ matrix.slug }}-${{ github.run_attempt }}
          path: Build/Validation/028/medium-metal-${{ matrix.slug }}
          if-no-files-found: error
          include-hidden-files: true
      - name: Upload medium shard authority
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: production-medium-authority-${{ matrix.slug }}-${{ github.run_attempt }}
          path: |
            Build/Validation/028/medium-metal-${{ matrix.slug }}/summary.json
            Build/Validation/028/medium-metal-${{ matrix.slug }}/artifact-manifest.json
          if-no-files-found: error

  medium-aggregate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Aggregate medium Metal shards
    needs: medium
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Download medium shard evidence
        uses: actions/download-artifact@v6
        with:
          pattern: production-medium-authority-*-${{ github.run_attempt }}
          path: Build/Validation/028/medium-shards
      - name: Validate exact medium package authority
        run: >-
          python .github/scripts/aggregate_production_medium.py
          --root Build/Validation/028/medium-shards
          --profile Config/Validation/ProductionContent/Medium.json
          --target-profile Config/AssetCooker/Profiles/Production/Mac-Metal-X86_64.json
          --output Build/Validation/028/medium-aggregate/summary.json
      - name: Upload aggregate medium evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-medium-aggregate-${{ github.run_attempt }}
          path: Build/Validation/028/medium-aggregate
          if-no-files-found: error
