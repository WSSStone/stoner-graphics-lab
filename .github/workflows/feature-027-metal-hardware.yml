name: Feature 027 Metal Hardware

on:
  workflow_dispatch:
  # A newly introduced workflow cannot be manually dispatched until its file
  # exists on the default branch. This branch-scoped trigger makes the initial
  # pre-merge hardware gate observable without weakening its runner labels.
  push:
    branches:
      - "027-metal-backend"
    paths:
      - ".github/workflows/feature-027-metal-hardware.yml"

permissions:
  contents: read

concurrency:
  group: feature-027-hardware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-metal:
    name: Native Metal ${{ matrix.arch }} (${{ matrix.runner-kind }})
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            slug: macos-arm64
            runner-kind: physical-self-hosted
            labels: [self-hosted, macOS, metal, arm64]
            profile: Config/AssetCooker/Profiles/Mac-Metal-Arm64.json
          - arch: x86_64
            slug: macos-x86_64
            runner-kind: github-hosted
            labels: macos-26-intel
            profile: Config/AssetCooker/Profiles/Mac-Metal-X86_64.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify runner architecture and Metal toolchain
        shell: bash
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          /usr/bin/xcrun --find metal
          /usr/bin/xcrun --find metallib
          /usr/bin/xcrun xcodebuild -version
          /usr/bin/xcrun --sdk macosx --show-sdk-version
      - name: Create isolated Python environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/feature027-venv"
          "$RUNNER_TEMP/feature027-venv/bin/python" -m pip install scons==4.10.1
          echo "$RUNNER_TEMP/feature027-venv/bin" >> "$GITHUB_PATH"
      - name: Prepare failure-safe hardware report
        run: >-
          python .github/scripts/run_metal_validation.py
          --root . --tier deterministic --workload derivation --prepare-only
          --output Validation/027/CI/work/hardware-${{ matrix.slug }}/bootstrap.json
      - name: Build strict Release
        run: scons config=release strict=1
      - name: Verify architecture and validation tooling
        run: |
          python Tests/verify_architecture.py
          python Tests/verify_metal_backend.py --root . --mode all
          python -m unittest Tests/test_verify_architecture.py Tests/test_verify_metal_backend.py
          python .github/scripts/test_run_metal_validation.py
          python .github/scripts/test_run_metal_native_cook.py
          python .github/scripts/test_run_metal_render_acceptance.py
      - name: Run deterministic MSL derivation twenty times
        run: >-
          python .github/scripts/run_metal_validation.py
          --root . --tests Build/Mac/Release/Tests/StonerTest
          --tier deterministic --workload derivation --repetitions 20
          --work Build/Feature027Validation/${{ matrix.slug }}/derivation
          --output Validation/027/CI/work/hardware-${{ matrix.slug }}/derivation.json
          --timeout-seconds 1200
      - name: Require native shader, RHI, and deferred readback evidence
        run: >-
          python .github/scripts/run_metal_validation.py
          --root . --tests Build/Mac/Release/Tests/StonerTest
          --profile ${{ matrix.profile }} --tier native-offscreen
          --workload native --require-native
          --work Build/Feature027Validation/${{ matrix.slug }}/native
          --output Validation/027/CI/work/hardware-${{ matrix.slug }}/native.json
          --timeout-seconds 1800
      - name: Require native Metal and Vulkan comparison
        run: >-
          python .github/scripts/run_metal_validation.py
          --root . --tests Build/Mac/Release/Tests/StonerTest
          --profile ${{ matrix.profile }} --tier cross-backend
          --workload comparison --require-native
          --work Build/Feature027Validation/${{ matrix.slug }}/comparison
          --output Validation/027/CI/work/hardware-${{ matrix.slug }}/comparison.json
          --timeout-seconds 1800
      - name: Run native shader publication and shared triangle integration
        run: >-
          Build/Mac/Release/Tests/StonerTest
          --suite metal-shader-compiler
          --suite metal-shader-cooker
          --suite metal-shader-publication
          --suite metal-shader-runtime
          --suite triangle-demo
      - name: Require deterministic production Metal cook and pipeline creation
        run: >-
          python .github/scripts/run_metal_native_cook.py
          --root .
          --cooker Build/Mac/Release/Tools/AssetCooker/StonerAssetCooker
          --tests Build/Mac/Release/Tests/StonerTest
          --profile ${{ matrix.profile }}
          --work Build/Feature027Validation/${{ matrix.slug }}/native-cook
          --output Validation/027/CI/work/hardware-${{ matrix.slug }}/native-cook.json
          --repetitions 20
          --timeout-seconds 1800
      - name: Require strict-cooked Metal and Vulkan render acceptance
        run: >-
          python .github/scripts/run_metal_render_acceptance.py
          --root .
          --tests Build/Mac/Release/Tests/StonerTest
          --demo Build/Mac/Release/Demo/StonerDemo/StonerDemo
          --profile ${{ matrix.profile }}
          --publication Build/Feature027Validation/${{ matrix.slug }}/native-cook/run-00/Cooked
          --lease Build/Feature027Validation/${{ matrix.slug }}/render-lease
          --output-dir Validation/027/CI/work/hardware-${{ matrix.slug }}/render
          --work Build/Feature027Validation/${{ matrix.slug }}/render
          --timeout-seconds 1800
      - name: Require bounded real-window Metal presentation smoke
        run: >-
          python .github/scripts/run_metal_validation.py
          --root .
          --tests Build/Mac/Release/Tests/StonerTest
          --presentation-probe Build/Mac/Release/Tests/MetalPresentationProbe
          --tier visible-manual
          --workload presentation-smoke
          --smoke-frames 120
          --smoke-cycles 4
          --work Build/Feature027Validation/${{ matrix.slug }}/presentation-smoke
          --output Validation/027/CI/work/hardware-${{ matrix.slug }}/presentation-smoke.json
          --timeout-seconds 600
      - name: Run failure determinism
        run: >-
          python .github/scripts/run_metal_validation.py
          --root . --tests Build/Mac/Release/Tests/StonerTest
          --tier deterministic --workload failure --repetitions 20
          --work Build/Feature027Validation/${{ matrix.slug }}/failure
          --output Validation/027/CI/work/hardware-${{ matrix.slug }}/failure.json
          --timeout-seconds 1200
      - name: Run required native lifecycle and RSS gate
        run: >-
          python .github/scripts/run_metal_validation.py
          --root . --tests Build/Mac/Release/Tests/StonerTest
          --profile ${{ matrix.profile }} --tier native-offscreen
          --workload lifecycle --lifecycle-iterations 10000 --require-native
          --work Build/Feature027Validation/${{ matrix.slug }}/lifecycle
          --output Validation/027/CI/work/hardware-${{ matrix.slug }}/lifecycle.json
          --timeout-seconds 3600
      - name: Upload required native evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: metal-hardware-${{ matrix.slug }}-${{ github.run_attempt }}
          path: |
            Validation/027/CI/work/hardware-${{ matrix.slug }}
            Build/Feature027Validation/${{ matrix.slug }}
          if-no-files-found: error
